server.port=8084
spring.application.name=mentorship-service

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/mentorship?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT (validação do token emitido pelo auth-service - formato A ALINHAR com a Equipe B)
# O valor padrão abaixo é APENAS para desenvolvimento local.
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
security.jwt.roles-claim=${JWT_ROLES_CLAIM:role}

# Integração com outros serviços (URLs a alinhar)
services.matchmaking.url=${MATCHMAKING_URL:http://localhost:8085}
services.matchmaking.stub-enabled=${MATCHMAKING_STUB:true}

# Actuator
management.endpoints.web.exposure.include=health,info
